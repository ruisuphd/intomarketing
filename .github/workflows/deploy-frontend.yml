name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      # Mirrors frontend/apphosting.yaml so this job passes when GitHub secrets are unset.
      # Firebase App Hosting also builds from source with the same file on deploy.
      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAKVpYH8o81Ym3hYK3J3HnGj754_RbgfeE
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: intonation-labs-marketing.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: intonation-labs-marketing
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: intonation-labs-marketing.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "201123615163"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:201123615163:web:d29962f99fc7e2ac80749e
          NEXT_PUBLIC_API_URL: https://automark-api-qglnjkfpjq-as.a.run.app
          NEXT_PUBLIC_SITE_URL: https://automark-web--intonation-labs-marketing.asia-east1.hosted.app
          NEXT_PUBLIC_SENTRY_DSN: ""
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_51TA7GZE6eNlRVcoBFs7XIF4P5SMZTEYw8Vg68gOGpC2qRSjhe8dwKlrG3FWLr4keAgN84FkXH0slrNr9Vc7oWnKG00CDiEluHT
          NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID: prctbl_1TDy46E6eNlRVcoB9E4pa94S

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase App Hosting
        run: npx --yes firebase-tools@14 deploy --only apphosting:automark-web --project intonation-labs-marketing --non-interactive
