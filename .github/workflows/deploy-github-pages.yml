name: Deploy portfolio (GitHub Pages)

# Static export from frontend/ (`npm run build:portfolio`).
# Repo → Settings → Pages: Source = GitHub Actions.
# Optional overrides (Settings → Secrets and variables → Variables):
#   PORTFOLIO_SITE_URL   Custom canonical URL including https://
#   PORTFOLIO_BASE_PATH  Subpath segment only, no slashes (default: repo name or empty for *.github.io user site).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Canonical URL and base path
        id: meta
        env:
          SITE_OVERRIDE: ${{ vars.PORTFOLIO_SITE_URL }}
          BP_OVERRIDE: ${{ vars.PORTFOLIO_BASE_PATH }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"

          if [ -z "${SITE_OVERRIDE:-}" ]; then
            if [ "${REPO}" = "${OWNER}.github.io" ]; then
              echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
              echo "base_path_seg=" >> "$GITHUB_OUTPUT"
            else
              echo "site_url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"
              echo "base_path_seg=${REPO}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "site_url=${SITE_OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "base_path_seg=${BP_OVERRIDE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build portfolio export
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ steps.meta.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.meta.outputs.base_path_seg }}
          NEXT_PUBLIC_API_URL: https://portfolio-archived.invalid
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
          NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build:portfolio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
